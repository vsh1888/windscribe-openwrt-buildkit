name: Build OpenWrt APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package/**'
      - 'build-sdk.sh'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl zstd
      - name: Build for OpenWrt 25.12.6 ipq40xx/chromium
        run: bash ./build-sdk.sh
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-openwrt-apk-armv7
          path: dist/*
          if-no-files-found: error
